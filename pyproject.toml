[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity"
version = "0.1.0"
description = "Does your agent stay itself? Consistency checks for long-running agent memory and session records."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Sophia Marie DeClue"}]
keywords = ["agents", "continuity", "memory", "evaluation", "drift", "measurement"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Sophia-Thickums/continuity"

[project.scripts]
continuity = "continuity.runner:main"

[tool.setuptools]
packages = ["continuity"]
